name: 构建

on:
  push:
    branches: [main]
  pull_request:

jobs:
  arch-linux:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: 安装构建依赖
        run: >-
          pacman -Syu --noconfirm git cmake clang boost fcitx5 fcitx5-qt libime libc++
          json-c curl bubblewrap util-linux python qt6-base qt6-svg
          qt6-webengine pipewire ffmpeg wl-clipboard libnotify polkit
      - uses: actions/checkout@v7
      - name: 配置
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
      - name: 构建
        run: cmake --build build --parallel
      - name: 检查脚本
        run: |
          for script in scripts/*.sh.in; do
            case "$script" in *-syncd.sh.in|*-update.sh.in) continue;; esac
            sh -n "$script"
          done
          python3 -m py_compile scripts/setup_runtime.py tools/*.py \
            build/fcitx5-wetypex-syncd build/fcitx5-wetypex-update
